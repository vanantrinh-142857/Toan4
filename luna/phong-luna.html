<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phòng thay đồ của Luna</title>
<!-- v9.3.0: 4 bộ đồ, mỗi bộ 6 hình Luna (luna/bo/<bộ>-<bước>.webp, bước 1..6).
     Món trong một bộ phải lấy lần lượt: váy → giày → vòng cổ → bông tai → nơ → vương miện (hoặc cài hoa / túi xách).
     Có bao nhiêu món thì Luna hiện đúng hình bước đó. Ảnh nhỏ của món: anh/luna/<bộ>-<loại>.webp.
     Giao tiếp với app (postMessage, khoá "toan4"): con gửi ready / state / locked; app gửi init {owned, state, wear}. -->
<style>
:root{--ink:#4a3346;--muted:#9a7f92;--accent:#c0659a;--soft:#fbeef5;--line:#ecdbe6;--lock:#efe7ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fdf6f9;color:var(--ink);font-family:Nunito,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.stage{position:relative;flex:1 1 60%;min-height:210px;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#fff 18%,#fff5f9 55%,#f5e3ec 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#f7e9f0,#f1dbe6)}
.fig{position:absolute;left:50%;bottom:3%;height:92%;transform:translateX(-50%);display:flex;justify-content:center}
.body{position:relative;height:100%;transform-origin:50% 100%;animation:idle 3.6s ease-in-out infinite;will-change:transform}
.body img{height:100%;width:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.body.pop{animation:pop .7s ease-out}
.shadow{position:absolute;left:50%;bottom:-1%;width:44%;height:3%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#5b3d4e33 0,#5b3d4e14 60%,transparent 72%)}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.004,1.012)}}
@keyframes pop{0%{transform:scale(.96,.96);filter:brightness(1.25)}45%{transform:scale(1.035,1.035);filter:brightness(1.08)}100%{transform:scale(1,1);filter:none}}
.spark{position:absolute;left:50%;top:40%;font-size:clamp(16px,4vh,28px);pointer-events:none;opacity:0}
.spark.go{animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
.oname{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;color:#a0698a;background:#ffffffcc;padding:4px 10px;border-radius:12px;z-index:2;display:flex;gap:8px;align-items:center}
.oname small{font-weight:800;color:#fff;background:var(--accent);padding:1px 8px;border-radius:10px;font-size:12px}
.dots{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:2}
.dots i{width:12px;height:12px;border-radius:50%;background:#ecdbe6;border:2px solid #fff;box-shadow:0 1px 3px #c0659a33}
.dots i.on{background:var(--accent)}
.dots i.cur{box-shadow:0 0 0 3px #c0659a55}
@media (prefers-reduced-motion:reduce){.body,.spark{animation:none!important}}
/* tủ đồ */
.closet{flex:0 0 auto;height:40%;min-height:190px;min-width:0;display:flex;flex-direction:column;background:#fff;border-top:2px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 8px 6px;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:16px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;padding:4px 8px 10px;align-content:start}
.sec{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px;color:#a0698a;padding:4px 2px 0}
.sec small{font-weight:700;color:var(--muted)}
.sec button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:3px 10px;font-weight:800;font-size:12px;color:var(--accent)}
.it{position:relative;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.it img{width:100%;height:60px;object-fit:contain;pointer-events:none}
.it.big img{height:92px}
.it span{font-size:11px;font-weight:700;line-height:1.2;text-align:center;color:#7d5d73}
.it.on{border-color:var(--accent);background:#fbe1ee;box-shadow:0 3px 10px #c0659a33}
.it.lock{background:var(--lock)}
.it.lock img{filter:grayscale(.85) opacity(.38)}
.it.lock:after{content:"🔒";position:absolute;right:6px;top:4px;font-size:17px}
.it small{font-size:10.5px;color:var(--muted);font-weight:700}
.no{position:absolute;left:5px;top:4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.it.lock .no{background:#b9a5b3}
.bar{width:84%;height:6px;border-radius:4px;background:#ecdbe6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#4a3346e6;color:#fff;padding:8px 14px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:3}
.toast.show{opacity:1}
@media (min-width:720px) and (min-aspect-ratio:1/1){.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.it img{height:78px}.it.big img{height:118px}.wrap{flex-direction:row}.stage{flex:1 1 50%}.closet{height:auto;flex:0 0 44%;border-top:0;border-left:2px solid var(--line)}}
</style></head><body>
<div class="wrap">
  <div class="stage" id="stage"><div class="floor"></div>
    <div class="fig"><div class="shadow"></div><div class="body" id="body"><img id="luna" alt="Luna"></div></div>
    <div class="oname" id="oname"></div><div class="dots" id="dots"></div><div class="toast" id="toast"></div></div>
  <div class="closet"><div class="tabs" id="tabs" role="tablist"></div><div class="grid" id="grid"></div></div>
</div>
<script>
(function () {
  "use strict";
  var EN = false; try { EN = new URLSearchParams(location.search).get("lang") === "en"; } catch (e) {}
  document.documentElement.lang = EN ? "en" : "vi";
  var L = function (vi, en) { return EN ? en : vi; };
  var IMG = "../anh/luna/", BIG = "bo/";
  var EMB = false; try { EMB = parent !== window; } catch (e) {}
  var post = function (o) { if (EMB) try { parent.postMessage(o, "*"); } catch (e) {} };

  /* 4 bộ. Mỗi bộ: 5 món chung + món cuối (vương miện / cài hoa / túi xách). Thứ tự này khớp thứ tự các dòng trong du-lieu/phan-thuong.js */
  var OUT = [
    { n: "01", ten: L("Công chúa hoa hồng", "Rose Princess"), last: "crown" },
    { n: "02", ten: L("Dạ tiệc Sapphire", "Sapphire Gala"), last: "crown" },
    { n: "03", ten: L("Nàng thơ ngọc lục bảo", "Emerald Muse"), last: "flower" },
    { n: "04", ten: L("Tiểu thư Lavender", "Lady Lavender"), last: "bag" }
  ];
  var BASE = [["dress", L("Váy", "Dress")], ["shoes", L("Giày", "Shoes")], ["necklace", L("Vòng cổ", "Necklace")], ["earrings", L("Bông tai", "Earrings")], ["bow", L("Nơ", "Bow")]];
  var LAST = { crown: L("Vương miện", "Crown"), flower: L("Cài hoa", "Hair flower"), bag: L("Túi xách", "Handbag") };
  var steps = function (o) { return BASE.concat([[o.last, LAST[o.last]]]); };
  var byN = function (n) { return OUT.find(function (o) { return o.n === n; }); };
  var itemId = function (o, cat) { return "luna-" + o.n + "-" + cat; };
  var FREE = { "luna-01-dress": 1 };
  var owned = null;   /* null = mở riêng trang này: mở hết */
  var own = function (id) { return !owned || FREE[id] || owned.has(id); };
  /* số món đã có theo thứ tự (dừng ở món đầu tiên chưa có) */
  var count = function (o) { var c = 0, s = steps(o); while (c < s.length && own(itemId(o, s[c][0]))) c++; return c; };

  /* Trạng thái: o = bộ đang chọn, k = bước đang xem (0 = mới nhất) */
  var st = { o: "01", k: 0 };
  function valid(s) {
    var o = { o: "01", k: 0 }, ob = s && byN(s.o);
    if (ob && count(ob) > 0) o.o = ob.n;
    else { var f = OUT.find(function (x) { return count(x) > 0; }); o.o = f ? f.n : "01"; }
    var c = count(byN(o.o)); if (s && s.o === o.o && s.k > 0 && s.k < c) o.k = s.k;
    return o;
  }
  var stageOf = function () { var c = count(byN(st.o)); return st.k > 0 ? st.k : c; };
  function apply(pop) {
    var o = byN(st.o), c = count(o), k = stageOf(), img = document.getElementById("luna"), src = BIG + o.n + "-" + Math.max(1, k) + ".webp";
    if (img.getAttribute("src") !== src) {
      img.setAttribute("src", src);
      if (pop) { var b = document.getElementById("body"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); sparkle(); }
    }
    document.getElementById("oname").innerHTML = o.ten + " <small>" + c + "/6</small>";
    document.getElementById("dots").innerHTML = steps(o).map(function (_, i) { return '<i class="' + (i < c ? "on" : "") + (i + 1 === k ? " cur" : "") + '"></i>'; }).join("");
  }
  function sparkle() {
    var sg = document.getElementById("stage"), E = ["✨", "💖", "⭐", "✨", "💫"];
    for (var i = 0; i < 6; i++) {
      var e = document.createElement("span"); e.className = "spark go"; e.textContent = E[i % E.length];
      var a = (i / 6) * Math.PI * 2; e.style.setProperty("--dx", Math.round(Math.cos(a) * 90) + "px"); e.style.setProperty("--dy", Math.round(Math.sin(a) * 70 - 30) + "px");
      e.style.marginLeft = "-10px"; sg.appendChild(e); (function (x) { setTimeout(function () { x.remove(); }, 1200); })(e);
    }
  }
  function save() { post({ toan4: "state", v: { o: st.o, k: st.k } }); }

  var toastT = 0;
  function toast(t) { var e = document.getElementById("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove("show"); }, 2800); }
  /* Món đang khoá: báo món cần lấy TRƯỚC (món đầu tiên chưa có của bộ) để app chỉ đường đúng */
  function locked(o) {
    var s = steps(o), c = count(o), cat = s[Math.min(c, s.length - 1)];
    toast(c === 0 ? L("Chưa có váy của bộ này. Học bài để nhận nhé!", "You don't have this outfit's dress yet. Learn to get it!")
      : L("Phải nhận " + cat[1].toLowerCase() + " trước nhé!", "Get the " + cat[1].toLowerCase() + " first!"));
    post({ toan4: "locked", id: itemId(o, cat[0]) });
  }

  /* ---------- Tủ đồ ---------- */
  var TABS = [["bo", L("👗 Bộ đồ", "👗 Outfits")], ["mon", L("🧩 Món đồ", "🧩 Pieces")]];
  var tab = "bo";
  function card(o) {
    return '<button class="it' + (o.big ? " big" : "") + (o.on ? " on" : "") + (o.lock ? " lock" : "") + '" data-k="' + o.k + '" aria-pressed="' + !!o.on + '">' + (o.no ? '<b class="no">' + o.no + "</b>" : "") +
      '<img src="' + IMG + o.img + '.webp" alt="" loading="lazy"><span>' + o.name + "</span>" + (o.sub || "") + "</button>";
  }
  function draw() {
    document.getElementById("tabs").innerHTML = TABS.map(function (t) { return '<button class="tab' + (t[0] === tab ? " on" : "") + '" role="tab" data-t="' + t[0] + '">' + t[1] + "</button>"; }).join("");
    var h = "", o = byN(st.o);
    if (tab === "bo") {
      OUT.forEach(function (x) {
        var c = count(x), sub = c === 6 ? "<small>" + L("Đủ bộ ✓", "Complete ✓") + "</small>" : "<small>" + c + "/6" + L(" món", " pieces") + '</small><div class="bar"><i style="width:' + Math.round(c / 6 * 100) + '%"></i></div>';
        h += card({ k: "bo:" + x.n, img: x.n + "-bo", big: 1, name: x.ten, sub: sub, on: st.o === x.n, lock: c === 0 });
      });
    } else {
      var c = count(o), k = stageOf();
      h += '<div class="sec"><span>' + o.ten + " · " + L("lấy theo thứ tự 1 → 6", "collect in order 1 → 6") + "</span>" + (st.k > 0 ? '<button data-k="latest">' + L("▶ Hình mới nhất", "▶ Latest look") + "</button>" : "<small>" + c + "/6</small>") + "</div>";
      steps(o).forEach(function (s, i) { h += card({ k: "mon:" + (i + 1), img: o.n + "-" + s[0], no: i + 1, name: s[1], on: k === i + 1 && i < c, lock: i >= c }); });
    }
    document.getElementById("grid").innerHTML = h;
  }
  document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-t]"); if (!b) return; tab = b.dataset.t; draw(); document.getElementById("grid").scrollTop = 0; });
  document.getElementById("grid").addEventListener("click", function (e) {
    var b = e.target.closest("[data-k]"); if (!b) return;
    var p = b.dataset.k.split(":"), o = byN(st.o);
    if (p[0] === "bo") {
      var x = byN(p[1]); if (count(x) === 0) return locked(x);
      st.o = x.n; st.k = 0;
    } else if (p[0] === "mon") {
      var i = +p[1]; if (i > count(o)) return locked(o);
      st.k = i === count(o) ? 0 : i;
    } else if (p[0] === "latest") st.k = 0;
    apply(true); draw(); save();
  });

  /* Món vừa nhận: mở đúng bộ, đúng bước, Luna đổi hình */
  function wear(id) {
    var m = /^luna-(\d\d)-(\w+)$/.exec(id || ""), o = m && byN(m[1]); if (!o) return;
    st.o = o.n; st.k = 0; tab = "mon";
    var c = count(o);
    setTimeout(function () { toast(c >= 6 ? L("Đủ bộ " + o.ten + "! Luna mặc đủ rồi!", o.ten + " is complete! Luna is fully dressed!") : L("Luna có thêm món mới! Còn " + (6 - c) + " món nữa là đủ bộ.", "A new piece for Luna! " + (6 - c) + " more to complete the outfit.")); }, 500);
  }

  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || d.toan4 !== "init") return;
    owned = new Set(d.owned || []);
    st = valid(d.state || st);
    if (d.wear) wear(d.wear);
    st = valid(st);
    apply(!!d.wear); draw(); if (d.wear) save(); reveal();
  });

  /* Nhúng trong app: ẩn đến khi app gửi tủ đồ thật (tránh nháy hình đủ bộ), tối đa 1,5 giây */
  var reveal = function () { document.documentElement.style.visibility = ""; };
  if (EMB) { document.documentElement.style.visibility = "hidden"; setTimeout(reveal, 1500); }
  var img = document.getElementById("luna");
  img.onerror = function () { toast(L("Không mở được hình Luna", "Could not load Luna")); };
  st = valid(st); apply(false); draw();
  post({ toan4: "ready" }); window.LUNA_READY = true;
  window.LUNA_ROOM = { state: function () { return st; }, owned: function () { return owned; }, count: function () { return count(byN(st.o)); } };
})();
</script>
</body></html>
